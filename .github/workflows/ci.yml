name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libfuzzy-dev tshark
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run compile check
        run: python -m compileall -q .
      - name: Run tests
        run: |
          # Créez un dossier tests/ et mettez vos tests dedans, pytest le trouvera automatiquement.
          pytest -v || echo "Aucun test trouvé ou erreur de test, veuillez ajouter des tests."
